[package]
name = "putting-watch-rs"
# Not the firmware's version: that comes from the git tag (see build.rs).
version = "0.0.0"
authors = ["Mitch Bradley <wmb@firmworks.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "putting-watch-rs"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf.git" }

[features]
# Builds an image that panics at the very start of main, before the OTA self-check confirms it.
# Used to test that the bootloader rolls a bad update back on its own. Never ship it as a release.
crash_on_boot = []

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = ["critical-section"] }
embedded-graphics = "0.8"
u8g2-fonts = { version = "0.8", features = ["embedded_graphics_textstyle"] }
putting-core = { version = "0.1.0", path = "crates/putting-core" }
sha2 = "0.10"
qrcodegen = "1.8"

[build-dependencies]
embuild = "0.33.5"
