; PlatformIO config for PuttingWatch
;
; Target: Waveshare ESP32-S3-Touch-AMOLED-2.06 watch devkit
;   MCU     ESP32-S3R8 (Xtensa LX7), 8 MB OCTAL PSRAM (OPI), 32 MB flash
;   Display 2.06" AMOLED 410x502, CO5300 driver over QSPI
;   Touch   FT3168 (I2C)
;   IMU     QMI8658C 6-axis (I2C, shares the touch bus)
;   PMU     AXP2101 (I2C) - gates the AMOLED / audio power rails
;   Audio   ES8311 codec + NS4150B amp (I2S)
;
; Environments:
;   esp32s3      - the firmware, tuned for fast ROUTINE rebuilds:
;                    * lib_deps versions pinned exactly (no per-build registry
;                      round-trip)
;                    * lib_ldf_mode = chain (regex #include scan only - skips
;                      the full-preprocessor pass chain+/deep+ run over LVGL's
;                      and Arduino_GFX's huge header trees every build)
;                    * every vendored include root named in build_flags
;                  If a routine build ever fails with a missing header, run the
;                  -ldf env once (below), then come back to this one.
;   esp32s3-ldf  - full dependency resolution (deep+). Run after adding or
;                  removing a library, bumping a version, or reworking the
;                  #include structure:  pio run -e esp32s3-ldf
;   native       - host build of lib/PuttingCore for the unit tests in test/.
;
; See ~/.claude/plans/shimmying-finding-whale.md for the full port plan.

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; qio_opi = QIO flash + OCTAL (OPI) PSRAM - required for the ESP32-S3R8's
; 8 MB octal PSRAM; the wrong memory_type boots without PSRAM (or not at all).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_32MB.csv

; imu_probe.cpp is a standalone sketch - only the imuprobe env builds it.
build_src_filter = +<*> -<imu_probe.cpp>

; Serial is native USB-CDC (HWCDC), not a UART bridge.
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  ; Name every vendored include root so a shallow LDF pass never has to
  ; discover them.
  -Isrc/assets
  -Ilib/PuttingCore
  -Ilib/Imu
  -Ilib/Clicker
  -Ilib/Es8311/src
  -Ilib/Battery/src
  -Ilib/Arduino_GFX/src
  -Ilib/Arduino_DriveBus/src

; Arduino_GFX and Arduino_DriveBus (FT3168 touch) are vendored in lib/ from
; Waveshare's own examples: their Arduino_GFX 1.6.0 is patched for
; arduino-esp32 >= 3.3 (the registry copy is not and fails to compile), and
; DriveBus is not on the PlatformIO registry at all. Versions pinned exactly
; so PlatformIO never phones the registry to check for updates on a build.
lib_deps =
  lvgl/lvgl @ 9.3.0
  lewisxhe/SensorLib @ 0.4.1
  lewisxhe/XPowersLib @ 0.3.3   ; AXP2101 - battery percentage readout

lib_ldf_mode = chain
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Full dependency resolution - use after changing dependencies or #includes.
[env:esp32s3-ldf]
extends = env:esp32s3
lib_ldf_mode = deep+

; ---------------------------------------------------------------------------
; Standalone QMI8658 hardware probe - compiles ONLY src/imu_probe.cpp with
; Wire + SensorLib, nothing else. Isolates the IMU from the full firmware.
;   pio run -e imuprobe -t upload -t monitor
[env:imuprobe]
extends = env:esp32s3
build_src_filter = -<*> +<imu_probe.cpp>
lib_deps = lewisxhe/SensorLib @ 0.4.1
lib_ignore = Clicker, Battery, Imu, PuttingCore, Es8311, Arduino_GFX, Arduino_DriveBus
lib_ldf_mode = chain

; ---------------------------------------------------------------------------
; Host build for the pure-C++ swing logic. Only lib/PuttingCore is portable;
; everything else pulls in Arduino / ESP-IDF headers.
[env:native]
platform = native
build_flags = -std=gnu++17 -Ilib/PuttingCore -Wall -Wextra
lib_compat_mode = off
lib_ignore = Imu, Clicker
test_framework = unity
test_filter = test_swingtracker
