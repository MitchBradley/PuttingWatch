; PlatformIO config for PuttingWatch
;
; Target: Waveshare ESP32-S3-Touch-AMOLED-2.06 watch devkit
;   MCU     ESP32-S3R8 (Xtensa LX7), 8 MB OCTAL PSRAM (OPI), 32 MB flash
;   Display 2.06" AMOLED 410x502, CO5300 driver over QSPI
;   Touch   FT3168 (I2C)
;   IMU     QMI8658C 6-axis (I2C, shares the touch bus)
;   PMU     AXP2101 (I2C) - gates the AMOLED / audio power rails
;   Audio   ES8311 codec + NS4150B amp (I2S)
;
; Two environments:
;   esp32s3  - the firmware, built for the board (needs the espressif32 toolchain)
;   native   - host build of lib/PuttingCore only, for the unit tests in test/
;
; See ~/.claude/plans/shimmying-finding-whale.md for the full port plan.

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; qio_opi = QIO flash + OCTAL (OPI) PSRAM - required for the ESP32-S3R8's
; 8 MB octal PSRAM; the wrong memory_type boots without PSRAM (or not at all).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_32MB.csv

; Serial is native USB-CDC (HWCDC), not a UART bridge.
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE

; Arduino_GFX and Arduino_DriveBus (FT3168 touch) are vendored in lib/ from
; Waveshare's own examples: their Arduino_GFX 1.6.0 is patched for
; arduino-esp32 >= 3.3 (the registry copy is not and fails to compile), and
; DriveBus is not on the PlatformIO registry at all. LVGL 9.3.0 matches the
; version Waveshare's examples ship.
lib_deps =
  lvgl/lvgl @ 9.3.0
  lewisxhe/SensorLib
  lewisxhe/XPowersLib

lib_ldf_mode = deep+
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Host build for the pure-C++ swing logic. Only lib/PuttingCore is portable;
; everything else pulls in Arduino / ESP-IDF headers.
[env:native]
platform = native
build_flags = -std=gnu++17 -Ilib/PuttingCore -Wall -Wextra
lib_compat_mode = off
lib_ignore = Imu, Clicker
test_framework = unity
test_filter = test_swingtracker
