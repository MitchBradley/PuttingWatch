; PlatformIO config for PuttingWatch
;
; Two watch devkits, same core peripherals, different MCU/GPIOs:
;   ESP32-S3-Touch-AMOLED-2.06 (original) - ESP32-S3R8 (Xtensa LX7 dual-core),
;     8 MB OCTAL PSRAM (OPI), 32 MB flash, up to 240 MHz. Its QMI8658 IMU is
;     dead (see imu_probe.cpp findings / project memory) - shelved, not
;     removed.
;   ESP32-C6-Touch-AMOLED-2.06 (replacement) - ESP32-C6 (RISC-V single-core),
;     no PSRAM, 16 MB flash, up to 160 MHz.
; Both: 2.06" AMOLED 410x502 (CO5300/QSPI), FT3168 touch (I2C), QMI8658 IMU
; (I2C, shares the touch bus), AXP2101 PMU (I2C, gates AMOLED/audio power),
; ES8311 codec + amp (I2S). include/pin_config.h picks the right pin map per
; board from CONFIG_IDF_TARGET.
;
; Environments:
;   esp32s3, esp32c6   - the firmware for each board, tuned for fast ROUTINE
;                    rebuilds:
;                    * lib_deps versions pinned exactly (no per-build registry
;                      round-trip)
;                    * lib_ldf_mode = chain (regex #include scan only - skips
;                      the full-preprocessor pass chain+/deep+ run over
;                      Arduino_GFX's huge header trees every build)
;                    * every vendored include root named in build_flags
;                  If a routine build ever fails with a missing header, run the
;                  matching -ldf env once (below), then come back to this one.
;   esp32s3-ldf, esp32c6-ldf - full dependency resolution (deep+). Run after
;                  adding or removing a library, bumping a version, or
;                  reworking the #include structure.
;   imuprobe, imuprobe-c6   - standalone IMU-only hardware probes (per board).
;   native       - host build of lib/PuttingCore for the unit tests in test/.
;
; See ~/.claude/plans/shimmying-finding-whale.md for the full port plan.

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; The platform is pinned to an exact release (not the moving "stable" URL) so
; every build - yours and CI's - uses the same Arduino core (here 3.3.11) and
; toolchain. "stable" moved on to a release needing a newer PlatformIO Core than
; the one CI pins and broke the first release build. To upgrade: change all three
; platform = URLs together, build and test on the watch, and raise the
; `pip install platformio==...` pin in .github/workflows/release.yml if the new
; platform requires a newer Core (its platform.json says under "engines").
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; qio_opi = QIO flash + OCTAL (OPI) PSRAM - required for the ESP32-S3R8's
; 8 MB octal PSRAM; the wrong memory_type boots without PSRAM (or not at all).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_32MB.csv

; imu_probe.cpp is a standalone sketch - only the imuprobe env builds it.
build_src_filter = +<*> -<imu_probe.cpp>

; Serial is native USB-CDC (HWCDC), not a UART bridge.
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Iinclude
  ; Name every vendored include root so a shallow LDF pass never has to
  ; discover them.
  -Isrc/assets
  -Ilib/PuttingCore
  -Ilib/UpdateCore
  -Ilib/MiniUi
  -Ilib/Qrcodegen
  -Ilib/Imu
  -Ilib/Clicker
  -Ilib/Es8311/src
  -Ilib/Battery/src
  -Ilib/Arduino_GFX/src
  -Ilib/Arduino_DriveBus/src

; Arduino_GFX and Arduino_DriveBus (FT3168 touch) are vendored in lib/ from
; Waveshare's own examples: their Arduino_GFX 1.6.0 is patched for
; arduino-esp32 >= 3.3 (the registry copy is not and fails to compile), and
; DriveBus is not on the PlatformIO registry at all. Versions pinned exactly
; so PlatformIO never phones the registry to check for updates on a build.
lib_deps =
  lewisxhe/SensorLib @ 0.4.1
  lewisxhe/XPowersLib @ 0.3.3   ; AXP2101 - battery percentage readout

lib_ldf_mode = chain
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Full dependency resolution - use after changing dependencies or #includes.
[env:esp32s3-ldf]
extends = env:esp32s3
lib_ldf_mode = deep+

; ---------------------------------------------------------------------------
; Full firmware on the REPLACEMENT board - Waveshare ESP32-C6-Touch-AMOLED-
; 2.06 (the original S3 board's IMU died; see imu_probe.cpp / project memory).
; Single-core RISC-V @ 160 MHz max, no PSRAM, 16 MB flash. Same display/
; touch/IMU/codec parts as the S3 board but entirely different GPIOs -
; include/pin_config.h picks the right pin map from CONFIG_IDF_TARGET, set
; here by `board`. The Stop button does NOT use ESP32 deep sleep on this
; board: neither onboard button (BOOT=GPIO9, PWR=GPIO18) is in the C6's
; RTC/LP-IO range (GPIO0-7), so esp_sleep_enable_ext1_wakeup has no wake pin
; to use the way main.cpp uses BOOT on the S3 board. Instead it calls the
; AXP2101 PMU's own shutdown() (Battery::shutdown, main.cpp's
; enterPmuShutdown) - per the schematic, PWR (Key3) pulls the PMU's PWRON pin
; low through a 510R resistor, a real hardware power button wired for exactly
; this. Light sleep (double-tap on the run screen) is unaffected: GPIO
; wakeup during light sleep isn't restricted to the RTC/LP pins.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16MB.csv

; Writes include/fw_version.h (FW_VERSION from git describe).
extra_scripts = pre:tools/fw_version.py

; imu_probe.cpp is a standalone sketch - only the imuprobe-c6 env builds it.
build_src_filter = +<*> -<imu_probe.cpp>

; Serial is native USB-Serial/JTAG, not a UART bridge - same ARDUINO_USB_*
; flags as the S3 board select that path on C6 too.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Iinclude
  -Isrc/assets
  -Ilib/PuttingCore
  -Ilib/UpdateCore
  -Ilib/MiniUi
  -Ilib/Qrcodegen
  -Ilib/Imu
  -Ilib/Clicker
  -Ilib/Es8311/src
  -Ilib/Battery/src
  -Ilib/Arduino_GFX/src
  -Ilib/Arduino_DriveBus/src

lib_deps =
  lewisxhe/SensorLib @ 0.4.1
  lewisxhe/XPowersLib @ 0.3.3   ; AXP2101 - battery percentage readout

lib_ldf_mode = chain
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Full dependency resolution for the C6 build - use after changing
; dependencies or #includes.
[env:esp32c6-ldf]
extends = env:esp32c6
lib_ldf_mode = deep+

; ---------------------------------------------------------------------------
; Standalone QMI8658 hardware probe - compiles ONLY src/imu_probe.cpp with
; Wire + SensorLib, nothing else. Isolates the IMU from the full firmware.
;   pio run -e imuprobe -t upload -t monitor
[env:imuprobe]
extends = env:esp32s3
build_src_filter = -<*> +<imu_probe.cpp>
lib_deps = lewisxhe/SensorLib @ 0.4.1
lib_ignore = Clicker, Battery, Imu, PuttingCore, Es8311, Arduino_GFX, Arduino_DriveBus
lib_ldf_mode = chain

; ---------------------------------------------------------------------------
; QMI8658 probe on the REPLACEMENT board - Waveshare ESP32-C6-Touch-AMOLED-
; 2.06 (single-core RISC-V, no PSRAM, 16MB flash; touch/IMU I2C on GPIO7/8,
; not the S3 board's 14/15). Confirmed against waveshareteam's own
; 04_LVGL_QMI8658_ui example (pin_config.h + sdkconfig.defaults).
;   pio run -e imuprobe-c6 -t upload -t monitor
[env:imuprobe-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_src_filter = -<*> +<imu_probe.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPROBE_PIN_SDA=8
  -DPROBE_PIN_SCL=7
lib_deps = lewisxhe/SensorLib @ 0.4.1
lib_ldf_mode = chain
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Host build for the pure-C++ swing logic. Only lib/PuttingCore is portable;
; everything else pulls in Arduino / ESP-IDF headers.
[env:native]
platform = native
build_flags = -std=gnu++17 -Ilib/PuttingCore -Ilib/UpdateCore -Wall -Wextra
lib_compat_mode = off
lib_ignore = Imu, Clicker
test_framework = unity
test_filter =
  test_swingtracker
  test_updatecore
